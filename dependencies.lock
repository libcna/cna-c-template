# Compatibility baseline for cna-c-template.
#
# These are the exact revisions this template targets as its reproducible
# baseline. tools/dependency_pins.py is the parser used by setup instructions
# and CI; no workflow carries a second copy of these revisions.
#
# A user may deliberately test newer revisions, because the template consumes
# sibling checkouts. Such a build is outside the reproducible baseline until
# this file is updated after the compatibility checks and smoke tests pass.
#
# Which of these you actually need depends on the renderer you select:
#   CNA, SHARP_RUNTIME   always
#   EASY_GL, META_GL     the three EasyGL renderers (OPENGLES3/OPENGL33/WEBGL2)
# See docs/renderers.md for the full per-renderer dependency column.
#
# The pinned revisions are the released tags: CNA v0.1.0, sharp-runtime v0.1.0,
# easy-gl v0.1.1 and meta-gl v0.4.1. CNA 0.1.0 itself refuses a sibling that
# declares another version (cna/cmake/DependencyVersions.cmake), so these four
# must move together.
#
# When updating, change only this file, regenerate renderer files if CNA's list
# changed, and run the verification documented in README.md.
# Record format: NAME|GITHUB_OWNER/REPOSITORY|LOCAL_DIRECTORY|40_HEX_REVISION

