plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

def templateRootDir = rootProject.projectDir.parentFile.canonicalFile
def resolveFromTemplateRoot = { Object value ->
    def candidate = new File(value.toString())
    if (!candidate.isAbsolute()) {
        candidate = new File(templateRootDir, value.toString())
    }
    return candidate.canonicalFile
}

// dependencies.lock is shared with desktop CMake and CI. Each record owns the
// repository identity, sibling directory, and audited revision in one place.
def dependencyLockFile = new File(templateRootDir, "dependencies.lock")
def requiredDependencyNames = [
    "CNA", "SHARP_RUNTIME", "EASY_GL", "META_GL"
] as Set
def dependencyPins = [:]
dependencyLockFile.getText("UTF-8").readLines().eachWithIndex { rawLine, index ->
    def line = rawLine.trim()
    if (line.isEmpty() || line.startsWith("#")) {
        return
    }
    def fields = line.split(/\|/, -1) as List
    if (fields.size() != 4 ||
            !(fields[0] ==~ /[A-Z][A-Z0-9_]*/) ||
            !(fields[1] ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/) ||
            !(fields[2] ==~ /[A-Za-z0-9][A-Za-z0-9._-]*/) ||
            fields[2] in [".", ".."] ||
            !(fields[3] ==~ /[0-9a-f]{40}/)) {
        throw new GradleException(
            "Malformed dependency record at ${dependencyLockFile}:${index + 1}; " +
            "expected NAME|OWNER/REPOSITORY|DIRECTORY|REVISION."
        )
    }
    if (dependencyPins.containsKey(fields[0])) {
        throw new GradleException(
            "Duplicate dependency record ${fields[0]} in ${dependencyLockFile}."
        )
    }
    dependencyPins[fields[0]] = [
        repository: fields[1], directory: fields[2], revision: fields[3]
    ]
}
def missingDependencyPins = requiredDependencyNames - dependencyPins.keySet()
def unknownDependencyPins = dependencyPins.keySet() - requiredDependencyNames
if (!missingDependencyPins.isEmpty() || !unknownDependencyPins.isEmpty()) {
    throw new GradleException(
        "Invalid dependency set in ${dependencyLockFile}: " +
        "missing=${missingDependencyPins.sort()}, unknown=${unknownDependencyPins.sort()}."
    )
}
def cnaPin = dependencyPins["CNA"]
def sharpRuntimePin = dependencyPins["SHARP_RUNTIME"]

// Use the same dependency layout and order as root CMake and the renderer generator.
// Relative -PcnaRootDir overrides are deliberately resolved from the template root,
// never from the surprising android/app project directory.
def cnaRootOverride = providers.gradleProperty("cnaRootDir").getOrNull()
def cnaCandidates = [
    new File(templateRootDir.parentFile, cnaPin.directory).canonicalFile,
    new File(templateRootDir.parentFile.parentFile, cnaPin.directory).canonicalFile
]
def cnaRootDir = cnaRootOverride != null
        ? resolveFromTemplateRoot(cnaRootOverride)
        : (cnaCandidates.find { new File(it, "CMakeLists.txt").isFile() } ?: cnaCandidates[0])
def cnaSharpRuntimeRootOverride = providers.gradleProperty("cnaSharpRuntimeRootDir").getOrNull()
def cnaSharpRuntimeRootDir = cnaSharpRuntimeRootOverride != null
        ? resolveFromTemplateRoot(cnaSharpRuntimeRootOverride)
        : new File(cnaRootDir.parentFile, sharpRuntimePin.directory).canonicalFile
def cnaAllowUnpinnedText = providers.gradleProperty("cnaAllowUnpinned").getOrElse("false")
if (!(cnaAllowUnpinnedText ==~ /(?i:true|false)/)) {
    throw new GradleException(
        "-PcnaAllowUnpinned must be true or false, not '${cnaAllowUnpinnedText}'."
    )
}
def cnaAllowUnpinned = cnaAllowUnpinnedText.toBoolean()
def cnaRenderer = providers.gradleProperty("cnaRenderer").getOrElse("")

def verifyPinnedCheckout = { String dependencyName, File rootDir ->
    def pin = dependencyPins[dependencyName]
    if (!new File(rootDir, "CMakeLists.txt").isFile()) {
        throw new GradleException(
            "cna-c-template: ${dependencyName} was not found at ${rootDir}. " +
            "Expected the ${pin.repository} checkout recorded in dependencies.lock."
        )
    }

    if (!new File(rootDir, ".git").exists()) {
        logger.warn(
            "cna-c-template: ${dependencyName} at ${rootDir} has no .git metadata; " +
            "expected revision ${pin.revision} cannot be verified. " +
            "This is an unverified source archive."
        )
        return
    }

    def runGit = { List<String> arguments ->
        try {
            def command = ["git", "-C", rootDir.absolutePath] + arguments
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def output = process.inputStream.getText("UTF-8").trim()
            def status = process.waitFor()
            return [available: true, status: status, output: output]
        } catch (IOException exception) {
            return [available: false, status: -1, output: exception.message]
        }
    }
    def head = runGit(["rev-parse", "HEAD"])
    if (!head.available) {
        logger.warn(
            "cna-c-template: Git is unavailable, so ${dependencyName} at ${rootDir} " +
            "cannot be compared with expected revision ${pin.revision}."
        )
        return
    }

    if (head.status != 0) {
        throw new GradleException(
            "Git metadata exists at ${rootDir}, but HEAD could not be read: ${head.output}"
        )
    }
    def status = runGit(["status", "--porcelain", "--untracked-files=normal"])
    if (!status.available || status.status != 0) {
        throw new GradleException(
            "Git status failed for ${dependencyName} at ${rootDir}: ${status.output}"
        )
    }
    def drift = []
    if (head.output != pin.revision) {
        drift.add("revision is ${head.output}, expected ${pin.revision}")
    }
    if (!status.output.isEmpty()) {
        drift.add("worktree has local changes")
    }
    if (!drift.isEmpty()) {
        def detail = drift.join("; ")
        if (cnaAllowUnpinned) {
            logger.warn(
                "cna-c-template: intentional unpinned ${dependencyName} compatibility " +
                "test at ${rootDir}: ${detail}."
            )
        } else {
            throw new GradleException(
                "${dependencyName} checkout drift at ${rootDir}: ${detail}. Use the " +
                "${pin.repository} checkout recorded in dependencies.lock, or " +
                "explicitly acknowledge a compatibility test with " +
                "-PcnaAllowUnpinned=true."
            )
        }
    } else {
        logger.lifecycle(
            "cna-c-template: ${dependencyName} matches dependencies.lock (${pin.revision})"
        )
    }
}

verifyPinnedCheckout("CNA", cnaRootDir)
verifyPinnedCheckout("SHARP_RUNTIME", cnaSharpRuntimeRootDir)

// A Gradle help/configuration invocation does not enter CMake. When a renderer
// is explicitly selected, verify its direct sibling checkouts here as well;
// root CMake independently verifies the targets actually consumed, including
// CNA's platform default when no -PcnaRenderer value was supplied.
def rendererDependencyNames = []
if (cnaRenderer in ["OPENGLES3", "OPENGL33", "WEBGL2"]) {
    rendererDependencyNames.addAll(["EASY_GL", "META_GL"])
}
rendererDependencyNames.each { dependencyName ->
    def pin = dependencyPins[dependencyName]
    verifyPinnedCheckout(
        dependencyName,
        new File(cnaRootDir.parentFile, pin.directory).canonicalFile
    )
}

// Override with -PcnaRenderer=OPENGLES3 to pick a renderer other than CNA's own
// Android default (SDL_RENDERER). Not every renderer is Android-capable -- see
// docs/renderers.md -- and the ones that need ../easy-gl + ../meta-gl need those
// siblings present regardless of how this is built.
def cnaSdlJavaDir = new File(cnaRootDir, "third_party/SDL/android-project/app/src/main/java")
if (!cnaSdlJavaDir.isDirectory()) {
    throw new GradleException(
        "CNA SDL Android Java sources were not found at ${cnaSdlJavaDir}. " +
        "CNA was searched at ${cnaCandidates.join(', ')}. Clone the pinned CNA checkout " +
        "there or pass -PcnaRootDir=/path/to/cna (relative paths start at ${templateRootDir})."
    )
}

def templateContentDir = new File(templateRootDir, "Content")
if (!templateContentDir.isDirectory()) {
    throw new GradleException("Game content directory was not found at ${templateContentDir}.")
}
def generatedAssetsDir = file("$buildDir/generated/cnaTemplateAssets")

android {
    namespace = "org.openeggbert.cnatemplate"
    compileSdkVersion 35
    buildToolsVersion = "35.0.0"
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "org.openeggbert.cnatemplate"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // Pass Android platform and C++ STL config.
                def cmakeArgs = [
                        "-DANDROID_PLATFORM=android-21",
                        "-DANDROID_STL=c++_static",
                        "-DCNA_ROOT_DIR=${cnaRootDir}",
                        "-DCNA_SHARP_RUNTIME_ROOT=${cnaSharpRuntimeRootDir}",
                        "-DCNA_ALLOW_UNPINNED=${cnaAllowUnpinned ? 'ON' : 'OFF'}"
                ]
                if (!cnaRenderer.isEmpty()) {
                    cmakeArgs.add("-DCNA_GRAPHICS_RENDERER=${cnaRenderer}")
                }
                // Interpolated Groovy GStrings are not assignable to Java String[].
                arguments(*cmakeArgs.collect { argument -> argument.toString() })
                // Build only the APK library and its dependency closure, not CNA's
                // unrelated command-line tools or packaging targets.
                targets "main"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    signingConfigs {
        release {
            def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
            def hasCompleteProperties = keystorePropertiesFile.exists() &&
                    requiredKeys.every { key ->
                        def value = keystoreProperties[key]
                        value != null && !value.toString().trim().isEmpty()
                    }
            if (hasCompleteProperties) {
                // Relative storeFile paths are resolved from android/, beside key.properties.
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path rootProject.file('../CMakeLists.txt')
            version = "4.1.2"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [generatedAssetsDir]
            java.srcDirs = [
                cnaSdlJavaDir,
                // Game-specific Java (just the minimal stub subclassing SDLActivity)
                'src/main/java'
            ]
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint {
        abortOnError = true
    }
}

// Signing validation belongs to the task lifecycle, not the BuildType DSL. AGP
// does not create validateSigningRelease when the signing object is incomplete,
// so own a stable task and make preReleaseBuild depend on it instead of trying to
// decorate an optional AGP task by name.
def validateCnaReleaseSigning = tasks.register("validateCnaReleaseSigning") {
    group = "verification"
    description = "Checks the private credentials required by Android release builds."
    doLast {
        def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        if (!keystorePropertiesFile.isFile()) {
            throw new GradleException(
                "Release signing requires ${keystorePropertiesFile}. " +
                "Create it as documented in ../README.md under 'Android release signing'."
            )
        }
        def missingKeys = requiredKeys.findAll { key ->
            def value = keystoreProperties[key]
            value == null || value.toString().trim().isEmpty()
        }
        if (!missingKeys.isEmpty()) {
            throw new GradleException(
                "Release signing properties are missing or empty in ${keystorePropertiesFile}: " +
                "${missingKeys.join(', ')}. See ../README.md under 'Android release signing'."
            )
        }
        def configuredStoreFile = rootProject.file(keystoreProperties["storeFile"])
        if (!configuredStoreFile.isFile()) {
            throw new GradleException(
                "Release signing keystore was not found at ${configuredStoreFile}. " +
                "Fix storeFile in ${keystorePropertiesFile}; relative paths start in android/."
            )
        }
    }
}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    dependsOn(validateCnaReleaseSigning)
}

tasks.register("syncCnaTemplateContent", Sync) {
    from(templateContentDir)
    into(new File(generatedAssetsDir, "Content"))
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncCnaTemplateContent"))
}

dependencies {
    // No extra Java/Kotlin dependencies required - SDL provides the full activity.
}
